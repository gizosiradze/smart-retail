<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Retail · საცალო ვაჭრობის მართვის სისტემა</title>
<meta name="description" content="Smart Retail: კასა და მაღაზიის მართვა ერთ სისტემაში.">
<meta name="theme-color" content="#6d1a2e">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--brand:#6d1a2e;--bg:#faf7f6;--ink:#241a1d;--muted:#6b5f62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1000px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;color:var(--brand);font-weight:700;font-size:18px;text-decoration:none}
.logo img{width:34px;height:34px}
.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);padding:9px 18px}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.hero{max-width:620px}
.hero img{width:96px;height:96px;margin-bottom:16px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.2;margin:0 0 14px}
p{color:var(--muted);font-size:18px;line-height:1.55;margin:0 0 28px}
footer{padding:20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <a class="logo" href="./"><img src="icons/icon-192.png" alt="">Smart Retail</a>
  <a class="btn ghost" href="app/">შესვლა</a>
</header>
<main>
  <div class="hero">
    <img src="icons/icon-192.png" alt="Smart Retail">
    <h1>საცალო ვაჭრობის მართვის სისტემა</h1>
    <p>კასა და მაღაზიის მართვა ერთ სისტემაში. მუშაობს კომპიუტერზე, ტაბლეტსა და ტელეფონზე.</p>
    <a class="btn" href="app/">შესვლა სისტემაში</a>
  </div>
</main>
<footer>© Smart Retail</footer>
</body>
</html>
