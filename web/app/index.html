/* ===== LANDING ===== */
.lp{--ink:#1d1619;--mut:#6b6064;--wine:#8c1c3a;--wd:#6f1530;--deep:#2b0d17;--rose:#f6e4ea;--soft:#f6f2f3;--line:#e8dfe2;--ok:#1f8a5b;font:17px/1.65 'Noto Sans Georgian',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}

 <div class="lp-hd"><h2 class="lp-ser">ყველაფერი, რაც მაღაზიას ყოველდღე სჭირდება</h2><p>ქვემოთ სისტემის რეალური გვერდებია. სცადეთ დააჭიროთ ნებისმიერ ღილაკს.</p></div>
 <div class="lw-st"><article class="lw"><div class="lw-tx"><div class="lw-d on" data-v="stats"><h3>ციფრები, რომლებიც გადაწყვეტილებას გეხმარება</h3><p>ბრუნვა, მოგება და მარჟა ერთ გვერდზე, არჩეული პერიოდისთვის. გვერდი მარჯვნივ ისეთივეა, როგორსაც თქვენ დაინახავთ.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>შედარება წინა პერიოდთან და დღიური დინამიკა</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>რომელი საათი და რომელი დღეა ყველაზე დატვირთული</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ფილიალები, ზომები, კატეგორიები და ტოპ პროდუქტები</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მოგებაში ჩათვლილია გადახდის სისტემის საკომისიო</li></ul></div><div class="lw-d" data-v="prod"><h3>პროდუქტები ზომებით, ფასებით და ნაშთით</h3><p>ერთ პროდუქტს ათეული ზომა აქვს, Smart Retail კი თითოეულს ცალკე ითვლის ფილიალების მიხედვით.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>ზომები XXS-დან 10XL-მდე, რიცხვითი, ბავშვის და ფეხსაცმლის ზომები</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>შტრიხკოდი, სურათი, კატეგორია და ფავორიტები</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მცირე ნაშთი წითლად ჩანს</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>Excel-ში ატვირთვა და გადმოწერა</li></ul></div><div class="lw-d" data-v="tx"><h3>ყველა ჩეკი ერთ სიაში</h3><p>ფილიალის, სალაროს, გადახდის მეთოდისა და თარიღის მიხედვით. ჩეკზევე ჩანს, შენახულია თუ არა.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>ჩეკის გახსნა, დაბეჭდვა და დაბრუნება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>გადახდის მეთოდების პროცენტული წილი</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>შეუნახავი ჩეკის ხელახლა გაგზავნის ღილაკი</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>გაყოფილი გადახდა ნაღდით და ბარათით</li></ul></div><div class="lw-d" data-v="buy"><h3>შესყიდვა დოკუმენტით</h3><p>მიიღეთ საქონელი მომწოდებლის ინვოისით და მარაგი თავისით განახლდება.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>მომწოდებელი და ინვოისის ნომერი</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მიღება ზომებისა და რაოდენობის მიხედვით</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>საშუალო თვითღირებულება ახალ შესყიდვაზე თავისით ახლდება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>შესყიდვების ისტორია ფილიალების მიხედვით</li></ul></div><div class="lw-d" data-v="trf"><h3>გადაზიდვა ფილიალებს შორის</h3><p>ნაშთი ფილიალიდან ფილიალში გადადის დოკუმენტით: გაგზავნა, გზაში, მიღება. არაფერი იკარგება და ყველაფერი ჩანს.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>დრაფტი, გაგზავნა და მიღების დადასტურება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ნაშთი გაგზავნისას ჩამოიწერება, მიღებისას ემატება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მიღებისას დანაკლისი ცალკე ფიქსირდება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ბეჭდვა და სრული ისტორია ფილიალების მიხედვით</li></ul></div><div class="lw-d" data-v="sup"><h3>მომწოდებლები</h3><p>ნახეთ, ვისგან რამდენი შეიძინეთ და რა მოგება მოიტანა თითოეულმა.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>შესყიდვები მომწოდებლების მიხედვით დიაგრამაზე</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>შემოსავალი და მოგება თითო მომწოდებელზე</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>პერიოდები: თვე, 3 თვე, 6 თვე, წელი</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მომწოდებლის ბარათი კონტაქტებით</li></ul></div><div class="lw-d" data-v="cu"><h3>კლიენტები, რომლებიც ბრუნდებიან</h3><p>ლოიალობის წესებს თქვენ ადგენთ, სისტემა კი სალაროში თავისით ითვალისწინებს. ცხოველების მაღაზიისთვის ჯიში და წონაც ინახება.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>დონეები: სტანდარტი, ვერცხლი, ოქრო, პლატინა</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ფასდაკლება და ქულები შენაძენის მიხედვით</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ჯიში და წონა, ვადებისა და რჩევებისთვის</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მომხმარებლების Excel-ში გადმოწერა</li></ul></div><div class="lw-d" data-v="inv"><h3>ინვენტარიზაცია სკანერით, გაყიდვების შეწყვეტის გარეშე</h3><p>დაიწყეთ სესია, დაასკანერეთ ნივთები და დაასრულეთ. სესიის დროს მონაცემი ინახება და არ იკარგება.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>ავტომატური ჩაწერა სკანირებისას, Enter არ სჭირდება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>ნაშთის შედარება: დანაკლისი და ჭარბი</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>მხოლოდ დასრულებული ინვენტარიზაცია ინახება ისტორიაში</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>შესყიდვა დოკუმენტით: მომწოდებელი და ინვოისის ნომერი</li></ul></div><div class="lw-d" data-v="emp"><h3>თითოეულს მხოლოდ თავისი საქმე</h3><p>მოლარეს სალარო უჩანს, საწყობის მენეჯერს მარაგი, თქვენ კი ყველაფერი. საკომისიოებიც აქვე იმართება.</p><ul><li><svg width="18" height="18"><use href="#i-ck"/></svg>მოლარეებისა და მენეჯერების დამატება და გამორთვა</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>უფლებები ცალ-ცალკე: ფასდაკლება, დაბრუნება, ჩეკის შეჩერება</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>თანამშრომელი მიბმულია ფილიალზე</li><li><svg width="18" height="18"><use href="#i-ck"/></svg>გადახდის მეთოდის საკომისიო ითვლება მოგებაში</li></ul></div><button class="lp-btn ghost sm lw-ask" type="button">მინდა დემო</button></div>
