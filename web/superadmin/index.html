<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US')+' ₾';
const TODAY=new Date();TODAY.setHours(12,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ym=d=>iso(d).slice(0,7);
const MN=['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
const MS=['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
const ymLabel=p=>MN[+p.slice(5)-1]+' '+p.slice(0,4);
const dLabel=s=>{if(!s)return '—';const d=new Date(s);return d.getDate()+' '+MS[d.getMonth()]+' '+d.getFullYear()};
const ymAdd=(p,n)=>{let y=+p.slice(0,4),m=+p.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%2147483647;return h||1};
const rng=seed=>{let s=seed;return()=>{s=s*16807%2147483647;return(s-1)/2147483646}};
const uid=()=>Math.random().toString(36).slice(2,10);
const genPass=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
const nowStr=()=>{const d=new Date();return iso(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function toast(t){const e=document.createElement('div');e.className='tst';e.textContent=t;$('#toast').appendChild(e);setTimeout(()=>e.remove(),3200)}

/* ================= data ================= */
const K='rms_superadmin_v1';
let D;
function seed(){
  const plans=[
    {id:'basic',name:'Basic',price:49,branches:1,users:3,desc:'1 ფილიალი, სალარო + დეშბორდი'},
    {id:'std',name:'Standard',price:89,branches:3,users:10,desc:'3-მდე ფილიალი, ინვენტარიზაცია, ლოიალობა'},
    {id:'pro',name:'Pro',price:149,branches:10,users:40,desc:'10-მდე ფილიალი, ყველა ფუნქცია, პრიორიტეტული მხარდაჭერა'}];
  const P=Object.fromEntries(plans.map(p=>[p.id,p]));
  const stores=[],payments=[],audit=[];
  function mk(o){
    const created=addD(TODAY,-o.ago);
    const s={id:uid(),login:o.login,name:o.name,legal:o.legal,idcode:o.idcode,address:o.address||'თბილისი',owner:o.owner,phone:o.phone,email:o.email,
      plan:o.plan,kind:o.kind,branches:o.branches,status:o.status||'active',statusReason:o.reason||'',created:iso(created),
      trialEnd:iso(o.status==='trial'?addD(TODAY,o.trialLeft):addD(created,14)),payDay:Math.min(28,addD(created,14).getDate()),
      feeHist:[{from:ym(addD(created,14)),fee:o.fee||P[o.plan].price}],
      users:[{u:'admin',name:o.owner,role:'ადმინი',branch:'ყველა',last:iso(addD(TODAY,-(o.lastAgo||0)))}].concat(o.branches.map((b,i)=>({u:'point'+(i+1),name:'მოლარე '+(i+1),role:'მოლარე',branch:b,last:iso(addD(TODAY,-(o.lastAgo||0)))}))),
      lastActive:iso(addD(TODAY,-(o.lastAgo||0))),syncPending:o.sync||0,notes:o.notes||''};
    if(s.status==='suspended')s.suspendedAt=s.lastActive;
    stores.push(s);
    if(s.status!=='trial'){
      invoicesOf(s,P).forEach((inv,idx,arr)=>{
        const back=arr.length-1-idx;
        if((o.unpaid||[]).includes(back))return;
        if(inv.status==='upcoming')return;
        const amt=(o.partial===back)?Math.round(inv.amount/2):inv.amount;
        payments.push({id:uid(),store:s.id,period:inv.period,amount:amt,date:iso(addD(inv.due,Math.floor(Math.random()*4))),method:['გადარიცხვა','გადარიცხვა','ბარათი'][Math.floor(Math.random()*3)],note:''});
      });
    }
    audit.push({t:iso(created)+' 11:20',a:'მაღაზია დარეგისტრირდა',s:s.id});
  }
  mk({login:'zoomarket',name:'ზოო მარკეტი',legal:'შპს „ზოო მარკეტი"',idcode:'405123456',owner:'გიორგი ბერიძე',phone:'599 12 34 56',email:'info@zoomarket.ge',plan:'std',kind:'pet',branches:['ვაკე','საბურთალო','დიდუბე'],ago:250,lastAgo:0,sync:0});
  mk({login:'kidsland',name:'კიდს ლენდი',legal:'ი/მ ნინო კაპანაძე',idcode:'01017012345',owner:'ნინო კაპანაძე',phone:'577 45 67 89',email:'nino@kidsland.ge',plan:'basic',kind:'kids',branches:['მთავარი'],ago:190,lastAgo:0,unpaid:[0,1],sync:0});
  mk({login:'shoehouse',name:'ფეხსაცმლის სახლი',legal:'შპს „შუ ჰაუსი"',idcode:'404998877',owner:'დავით ლომიძე',phone:'555 22 33 44',email:'davit@shoehouse.ge',plan:'pro',kind:'shoes',branches:['გლდანი','ისანი','ვაკე','ბათუმი','ქუთაისი'],ago:320,lastAgo:0,partial:0,sync:3});
  mk({login:'sportline',name:'სპორტ ლაინი',legal:'შპს „სპორტ ლაინი"',idcode:'406554433',owner:'ლევან ხუციშვილი',phone:'591 77 88 99',email:'office@sportline.ge',plan:'std',kind:'sport',branches:['თბილისი მოლი','ისთ ფოინთი'],ago:140,lastAgo:1,sync:0});
  mk({login:'oasis',name:'ყვავილების ოაზისი',legal:'ი/მ მარიამ გელაშვილი',idcode:'01024056789',owner:'მარიამ გელაშვილი',phone:'568 11 22 33',email:'oasis.flowers@gmail.com',plan:'basic',kind:'flowers',branches:['მთავარი'],ago:120,lastAgo:26,unpaid:[0,1,2],status:'restricted',reason:'დავალიანება 2 თვეზე მეტი'});
  mk({login:'babystore',name:'ბეიბი სთორი',legal:'შპს „ბეიბი სთორი"',idcode:'405667788',owner:'ანა ჯაფარიძე',phone:'593 55 66 77',email:'ana@babystore.ge',plan:'std',kind:'kids',branches:['საბურთალო','გლდანი'],ago:10,status:'trial',trialLeft:4,lastAgo:0});
  mk({login:'petcity',name:'ფეტ სითი',legal:'შპს „ფეტ სითი"',idcode:'405778899',owner:'ირაკლი მაისურაძე',phone:'595 66 77 88',email:'irakli@petcity.ge',plan:'basic',kind:'pet',branches:['რუსთავი'],ago:3,status:'trial',trialLeft:11,lastAgo:0});
  mk({login:'techfix',name:'ტექ ფიქსი',legal:'შპს „ტექ ფიქსი"',idcode:'404112233',owner:'ნიკა წიკლაური',phone:'551 99 00 11',email:'nika@techfix.ge',plan:'basic',kind:'tech',branches:['დიღომი'],ago:290,lastAgo:75,status:'suspended',reason:'მფლობელის მოთხოვნით (მაღაზია დაიხურა)'});
  audit.sort((a,b)=>a.t<b.t?-1:1);
  return {v:1,plans,stores,payments,audit,ann:[{id:uid(),t:iso(addD(TODAY,-6))+' 10:00',type:'ტექნიკური სამუშაო',target:'all',text:'კვირას 03:00–04:00 სისტემა განახლდება. სალარო ინტერნეტის გარეშე რეჟიმში გააგრძელებს მუშაობას.'}],
    settings:{grace:7,restrictAfter:30,remindBefore:3,email:'admin@rms.ge',vatNote:'ფასები დღგ-ს ჩათვლით'}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.v===1)return s}catch(e){}return seed()}

const planOf=id=>D.plans.find(p=>p.id===id)||D.plans[0];
const storeOf=id=>D.stores.find(s=>s.id===id);
function feeFor(s,period){let f=s.feeHist[0].fee;for(const h of s.feeHist)if(h.from<=period)f=h.fee;return f}
/* invoices: one per month from first billing month to current month */
function invoicesOf(s,P){
  const out=[];if(s.status==='trial')return out;
  const start=ym(s.trialEnd),end=ym(TODAY),grace=(D&&D.settings?D.settings.grace:7);
  for(let p=start;p<=end;p=ymAdd(p,1)){
    const due=new Date(p+'-'+String(s.payDay).padStart(2,'0')+'T12:00:00');
    if(p===start&&due<new Date(s.trialEnd))continue;
    const amount=feeFor(s,p);
    const paid=D?D.payments.filter(x=>x.store===s.id&&x.period===p).reduce((a,x)=>a+x.amount,0):0;
    let status;
    if(paid>=amount)status='paid';
    else if(TODAY<due)status='upcoming';
    else if(daysBetween(due,TODAY)>grace)status='overdue';
    else status='due';
    if(s.status==='suspended'&&status!=='paid'&&p>ym(s.suspendedAt||TODAY))continue;
    out.push({store:s.id,period:p,due:iso(due),amount,paid,left:Math.max(0,amount-paid),status});
  }
  return out;
}
const INV_TAG={paid:'<span class="tg g">გადახდილი</span>',upcoming:'<span class="tg n">მოსალოდნელი</span>',due:'<span class="tg o">გადასახდელი</span>',overdue:'<span class="tg r">ვადაგადაცილებული</span>'};
function debtOf(s){return invoicesOf(s).filter(i=>i.status==='overdue'||i.status==='due').reduce((a,i)=>a+i.left,0)}
function overdueOf(s){return invoicesOf(s).filter(i=>i.status==='overdue')}
function nextDue(s){
  if(s.status==='trial')return s.trialEnd;
  const inv=invoicesOf(s).find(i=>i.status!=='paid');if(inv)return inv.due;
  const p=ymAdd(ym(TODAY),new Date(ym(TODAY)+'-'+String(s.payDay).padStart(2,'0'))<=TODAY?1:0);
  return p+'-'+String(s.payDay).padStart(2,'0');
}
function statusTag(s){
  if(s.status==='trial'){const d=daysBetween(TODAY,s.trialEnd);return '<span class="tg p">საცდელი · '+(d>=0?d+' დღე':'ვადა გავიდა')+'</span>'}
  if(s.status==='suspended')return '<span class="tg n">შეჩერებული</span>';
  if(s.status==='restricted')return '<span class="tg r">შეზღუდული</span>';
  return '<span class="tg g">აქტიური</span>';
}
function payTag(s){
  if(s.status==='trial')return '<span class="m">—</span>';
  const od=overdueOf(s),debt=debtOf(s);
  if(od.length)return '<span class="tg r">დავალიანება '+fmt(debt)+'</span><small>'+od.length+' თვე ვადაგადაცილებული</small>';
  if(debt>0)return '<span class="tg o">გადასახდელი '+fmt(debt)+'</span>';
  return '<span class="tg g">გადახდილი</span>';
}

function metrics(s){if(window.SRP&&SRP.on)return SRP.metrics(s);return metricsDemo(s)}
function metricsDemo(s){
  const r=rng(hash(s.id+s.login)),base={basic:550,std:1500,pro:4200}[s.plan]||800;
  const active=s.status==='active'||s.status==='trial';
  const days=[];for(let i=29;i>=0;i--){const d=addD(TODAY,-i),wk=[.8,1,1,1.05,1.15,1.35,1.25][d.getDay()];
    const ex=new Date(s.created)>d||(!active&&daysBetween(s.lastActive,d)>0);days.push({d:iso(d),v:ex?0:Math.round(base*wk*(.7+r()*.6))})}
  const sum=n=>days.slice(-n).reduce((a,x)=>a+x.v,0);
  const avg=[18,25,32,48,60,35][Math.floor(r()*6)];
  const rev30=sum(30);
  const br=s.branches.map(b=>({b,v:r()+.4}));const bt=br.reduce((a,x)=>a+x.v,0);br.forEach(x=>x.v=Math.round(rev30*x.v/bt));
  const pr=(PRODUCTS[s.kind]||PRODUCTS.pet).map(n=>({n,q:Math.round(5+r()*60)})).sort((a,b)=>b.q-a.q).slice(0,5);
  return {days,today:sum(1),d7:sum(7),d30:rev30,checks:Math.round(rev30/avg),avg,profit:Math.round(rev30*(.26+r()*.12)),
    customers:Math.round(40+r()*900*({basic:.4,std:1,pro:2.5}[s.plan]||1)),products:Math.round(80+r()*1500),branches:br,top:pr,
    stockValue:Math.round(base*(18+r()*20))};
}

const TR={'ა':'a','ბ':'b','გ':'g','დ':'d','ე':'e','ვ':'v','ზ':'z','თ':'t','ი':'i','კ':'k','ლ':'l','მ':'m','ნ':'n','ო':'o','პ':'p','ჟ':'zh','რ':'r','ს':'s','ტ':'t','უ':'u','ფ':'f','ქ':'k','ღ':'gh','ყ':'y','შ':'sh','ჩ':'ch','ც':'ts','ძ':'dz','წ':'ts','ჭ':'ch','ხ':'kh','ჯ':'j','ჰ':'h'};
function suggestLogin(){const l=$('#r_login');if(l.dataset.t)return;l.value=[...$('#r_name').value.toLowerCase()].map(c=>TR[c]||c).join('').replace(/[^a-z0-9]/g,'');chkLogin()}

function doRegister(){if(window.SRP&&SRP.on)return SRP.register();doRegisterLocal()}
function doRegisterLocal(){
  const g=k=>$('#r_'+k).value.trim();
  const req=[['name','დასახელება'],['login','სისტემის სახელი'],['owner','მფლობელი'],['phone','ტელეფონი'],['email','ელფოსტა']];
  for(const [k,l] of req)if(!g(k)){toast('შეავსეთ: '+l);$('#r_'+k).focus();return}
  if(D.stores.some(s=>s.login===g('login'))){toast('სისტემის სახელი დაკავებულია');return}
  if(!/^\S+@\S+\.\S+$/.test(g('email'))){toast('ელფოსტა არასწორია');return}
  if(!$('#r_terms').checked){toast('მონიშნეთ პირობებზე თანხმობა');return}
  const br=g('br').split('\n').map(x=>x.trim()).filter(Boolean);if(!br.length)br.push('მთავარი');
  const pl=planOf(REG.plan);
  const trial=+$('#r_trial').value,fee=+$('#r_fee').value||pl.price,pw=g('ap')||genPass(),au=g('au')||'admin';
  const s={id:uid(),login:g('login'),name:g('name'),legal:g('legal')||g('name'),idcode:g('idcode'),address:g('address'),owner:g('owner'),phone:g('phone'),email:g('email'),plan:pl.id,kind:$('#r_kind').value,branches:br,
    status:trial?'trial':'active',statusReason:'',created:iso(TODAY),trialEnd:iso(addD(TODAY,trial)),payDay:Math.max(1,Math.min(28,+$('#r_payday').value||1)),
    feeHist:[{from:ym(addD(TODAY,trial)),fee}],users:[{u:au,name:g('owner'),role:'ადმინი',branch:'ყველა',last:''}],
    lastActive:iso(TODAY),syncPending:0,notes:''};
  D.stores.push(s);log('მაღაზია დარეგისტრირდა ('+pl.name+', '+fmt(fee)+'/თვე'+(trial?', საცდელი '+trial+' დღე':'')+')',s.id);
  const warn=br.length>pl.branches?'<div class="banner" style="margin:0">ფილიალების რაოდენობა ('+br.length+') აღემატება '+pl.name+' პაკეტის ლიმიტს ('+pl.branches+').</div>':'';
  window._cred='მაღაზია: '+s.login+'\nმომხმარებელი: '+au+'\nპაროლი: '+pw;
  V.store=s.id;V.tab='dash';V.view='store';render();
  modal('<h3>✓ მაღაზია დარეგისტრირდა</h3><p style="margin:0">გადაეცით ეს მონაცემები მფლობელს (<b>'+esc(s.owner)+'</b>):</p><div class="cred">მაღაზია: <b>'+esc(s.login)+'</b><br>მომხმარებელი: <b>'+esc(au)+'</b><br>პაროლი: <b>'+esc(pw)+'</b></div>'+warn+
  '<small>რეალურ სისტემაში ეს მონაცემები ავტომატურად გაიგზავნება '+esc(s.email)+'-ზე. პაროლი სუპერ ადმინთან არ ინახება, ამიტომ ფანჯრის დახურვის შემდეგ ვეღარ ნახავთ.</small><div class="ft"><button onclick="copyT(window._cred)">კოპირება</button><button class="pri" onclick="closeM()">დახურვა</button></div>');
  REG={plan:'std'};
}

/* ================= billing ================= */
function billingView(){
  const cm=ym(TODAY);if(!V.bm)V.bm=cm;
  const months=[];for(let i=0;i<12;i++)months.push(ymAdd(cm,-i));
  const all=V.bm==='debt';
  let rows=[];
  D.stores.forEach(s=>invoicesOf(s).forEach(i=>{if(all?(i.status==='overdue'||i.status==='due'):i.period===V.bm)rows.push(Object.assign({s},i))}));
  const exp=rows.reduce((a,r)=>a+r.amount,0),got=rows.reduce((a,r)=>a+Math.min(r.paid,r.amount),0),left=exp-got;
  const F={all:()=>true,paid:r=>r.status==='paid',unpaid:r=>r.status!=='paid',overdue:r=>r.status==='overdue'};
  const shown=rows.filter(F[V.bf]).sort((a,b)=>({overdue:0,due:1,upcoming:2,paid:3}[a.status]-{overdue:0,due:1,upcoming:2,paid:3}[b.status])||(a.period<b.period?-1:1));
  const trials=D.stores.filter(s=>s.status==='trial');
  return '<div class="hd"><h2>გადახდები · აბონენტი</h2><div><select onchange="V.bm=this.value;render()"><option value="debt" '+(all?'selected':'')+'>ყველა გადაუხდელი</option>'+months.map(m=>'<option value="'+m+'" '+(V.bm===m?'selected':'')+'>'+ymLabel(m)+'</option>').join('')+'</select><button onclick="exportBilling()">ცხრილის კოპირება (Excel)</button><button class="pri" onclick="payModal()">+ გადახდის აღრიცხვა</button></div></div>'+
  '<div class="ks k4"><div><small>'+(all?'სულ გადასახდელი':'დარიცხული · '+ymLabel(V.bm))+'</small><b>'+fmt(exp)+'</b><em>'+rows.length+' ინვოისი</em></div><div><small>მიღებული</small><b style="color:var(--g)">'+fmt(got)+'</b><em>'+(exp?Math.round(got/exp*100):0)+'%</em></div><div><small>დარჩენილი</small><b style="color:'+(left?'var(--r)':'inherit')+'">'+fmt(left)+'</b><em>'+rows.filter(r=>r.status!=='paid').length+' მაღაზია</em></div><div><small>საცდელზე (ჯერ არ იხდის)</small><b>'+trials.length+'</b><em>პოტენციური '+fmt(trials.reduce((a,s)=>a+feeFor(s,ym(TODAY)),0))+'/თვე</em></div></div>'+
  '<div class="sg2" style="margin-bottom:12px">'+[['all','ყველა'],['paid','გადახდილი'],['unpaid','გადაუხდელი'],['overdue','ვადაგადაცილებული']].map(f=>'<button class="'+(V.bf===f[0]?'on':'')+'" onclick="V.bf=\''+f[0]+'\';render()">'+f[1]+' <small>'+rows.filter(F[f[0]]).length+'</small></button>').join('')+'</div>'+
  '<section>'+(shown.length?'<table><tr><th>მაღაზია</th>'+(all?'<th>თვე</th>':'')+'<th>პაკეტი</th><th>ვადა</th><th class="r">თანხა</th><th class="r">გადახდილი</th><th>სტატუსი</th><th></th></tr>'+
  shown.map(r=>{const lp=D.payments.filter(p=>p.store===r.s.id&&p.period===r.period).sort((a,b)=>a.date<b.date?1:-1)[0];const late=r.status==='overdue'?daysBetween(r.due,TODAY):0;
    return '<tr><td><b style="cursor:pointer" onclick="openStore(\''+r.s.id+'\')">'+esc(r.s.name)+'</b><small>'+esc(r.s.owner)+' · '+esc(r.s.phone)+'</small></td>'+(all?'<td>'+ymLabel(r.period)+'</td>':'')+'<td>'+planOf(r.s.plan).name+'</td><td>'+dLabel(r.due)+(late?'<small style="color:var(--r)">'+late+' დღით გადაცილებული</small>':'')+'</td><td class="r">'+fmt(r.amount)+'</td><td class="r">'+fmt(r.paid)+(lp?'<small>'+dLabel(lp.date)+'</small>':'')+'</td><td>'+INV_TAG[r.status]+'</td>'+
    '<td class="r" style="white-space:nowrap">'+(r.status!=='paid'?'<button class="sm" onclick="remind(\''+r.s.id+'\',\''+r.period+'\')">შეხსენება</button> <button class="sm pri" onclick="payModal(\''+r.s.id+'\',\''+r.period+'\')">გადახდა</button>':'<button class="sm" onclick="invoiceModal(\''+r.s.id+'\',\''+r.period+'\')">ინვოისი</button>')+'</td></tr>'}).join('')+'</table>':'<div class="empty">ჩანაწერი არ არის</div>')+'</section>'+
  '<div class="note">ვადაგადაცილებულად ითვლება გადახდის დღიდან '+D.settings.grace+' დღის შემდეგ (იცვლება „პარამეტრებში"). საცდელ და შეჩერებულ მაღაზიებს ახალი თანხა არ ერიცხებათ.</div>';
}
function remind(id,p){const s=storeOf(id),i=invoicesOf(s).find(x=>x.period===p);log('შეხსენება გაიგზავნა: '+ymLabel(p)+', '+fmt(i.left),id);toast('შეხსენება გაეგზავნა: '+s.email+' (რეალურ სისტემაში)')}
function exportBilling(){const r=[['მაღაზია','იურიდიული','ს/კ','თვე','ვადა','თანხა','გადახდილი','სტატუსი']];D.stores.forEach(s=>invoicesOf(s).forEach(i=>r.push([s.name,s.legal,s.idcode,i.period,i.due,i.amount,i.paid,{paid:'გადახდილი',upcoming:'მოსალოდნელი',due:'გადასახდელი',overdue:'ვადაგადაცილებული'}[i.status]])));csv('billing.csv',r);log('ექსპორტი: გადახდები')}

/* ================= plans ================= */
function plansView(){
  return '<div class="hd"><h2>პაკეტები და ფასები</h2></div><div class="g3">'+D.plans.map((p,i)=>{const n=D.stores.filter(s=>s.plan===p.id&&s.status!=='suspended').length;
    return '<section><h3>'+p.name+' <span class="tg b">'+n+' მაღაზია</span></h3><div class="fg" style="grid-template-columns:1fr 1fr">'+
    '<label class="fl">ფასი (₾/თვე)<input id="pl_p'+i+'" type="number" value="'+p.price+'"></label><label class="fl">დასახელება<input id="pl_n'+i+'" value="'+esc(p.name)+'"></label>'+
    '<label class="fl">ფილიალების ლიმიტი<input id="pl_b'+i+'" type="number" value="'+p.branches+'"></label><label class="fl">მომხმარებლების ლიმიტი<input id="pl_u'+i+'" type="number" value="'+p.users+'"></label></div>'+
    '<label class="fl" style="margin-top:10px">აღწერა<input id="pl_d'+i+'" value="'+esc(p.desc)+'"></label></section>'}).join('')+'</div>'+
  '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="note" style="flex:1">ახალი ფასი მოქმედებს <b>ახლად დარეგისტრირებულ</b> მაღაზიებზე. არსებულ მაღაზიებს ფასი ავტომატურად არ ეცვლებათ, ამისთვის გამოიყენეთ მაღაზიის გვერდზე „პაკეტი / ფასი".</div><button class="pri" onclick="savePlans()">შენახვა</button></div>';
}
function savePlans(){D.plans.forEach((p,i)=>{p.price=+$('#pl_p'+i).value||p.price;p.name=$('#pl_n'+i).value.trim()||p.name;p.branches=+$('#pl_b'+i).value||p.branches;p.users=+$('#pl_u'+i).value||p.users;p.desc=$('#pl_d'+i).value.trim()});log('პაკეტების პარამეტრები შეიცვალა');toast('შენახულია');render()}

/* ================= announcements ================= */
function annView(){
  return '<div class="hd"><h2>განცხადებები მაღაზიებისთვის</h2></div><div class="g2"><section><h3>ახალი განცხადება</h3>'+
  '<div class="fg"><label class="fl">ვის<select id="an_t"><option value="all">ყველა მაღაზიას</option>'+D.stores.filter(s=>s.status!=='suspended').map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></label><label class="fl">ტიპი<select id="an_y"><option>ინფორმაცია</option><option>ტექნიკური სამუშაო</option><option>ახალი ფუნქცია</option><option>გაფრთხილება</option></select></label></div>'+
  '<label class="fl" style="margin-top:10px">ტექსტი<textarea id="an_x" rows="4" placeholder="მაგ. ახალი ფუნქცია: ინვოისები იურიდიული პირებისთვის"></textarea></label>'+
  '<label class="fl" style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;font-weight:500;color:var(--t)"><input type="checkbox" id="an_e" style="width:auto"> ელფოსტითაც გაგზავნა</label>'+
  '<div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="pri" onclick="sendAnn()">გაგზავნა</button></div>'+
  '<div class="note" style="margin-top:10px">განცხადება გამოჩნდება მაღაზიის დეშბორდსა და სალაროში, ზედა ზოლში.</div></section>'+
  '<section><h3>გაგზავნილი</h3>'+(D.ann.length?D.ann.slice().reverse().map(a=>'<div class="row" style="align-items:flex-start"><span><span class="tg '+({'გაფრთხილება':'r','ტექნიკური სამუშაო':'o','ახალი ფუნქცია':'g'}[a.type]||'b')+'">'+esc(a.type)+'</span> <small style="display:inline">'+(a.target==='all'?'ყველას':esc((storeOf(a.target)||{}).name))+' · '+esc(a.t)+'</small><div style="margin-top:4px">'+esc(a.text)+'</div></span><button class="sm" onclick="delAnn(\''+a.id+'\')">✕</button></div>').join(''):'<div class="empty">ჯერ არაფერი</div>')+'</section></div>';
}
function sendAnn(){const x=$('#an_x').value.trim();if(!x){toast('დაწერეთ ტექსტი');return}const a={id:uid(),t:nowStr(),type:$('#an_y').value,target:$('#an_t').value,text:x};D.ann.push(a);log('განცხადება გაიგზავნა: '+a.type,a.target==='all'?'':a.target);toast('გაიგზავნა');render()}
function delAnn(id){D.ann=D.ann.filter(a=>a.id!==id);save();render()}

/* ================= audit ================= */
function auditView(){
  const q=V.aq.toLowerCase();const l=D.audit.slice().reverse().filter(a=>!q||(a.a+' '+((storeOf(a.s)||{}).name||'')).toLowerCase().includes(q));

  '<section><table><tr><th>დრო</th><th>ქმედება</th><th>მაღაზია</th></tr>'+l.slice(0,300).map(a=>{const s=storeOf(a.s);return '<tr><td style="white-space:nowrap">'+esc(a.t)+'</td><td>'+esc(a.a)+'</td><td>'+(s?'<span style="cursor:pointer;color:var(--a)" onclick="V.store=\''+s.id+'\';V.tab=\'log\';go(\'store\')">'+esc(s.name)+'</span>':'<span class="m">—</span>')+'</td></tr>'}).join('')+'</table></section>'+
  '<div class="note">სუპერ ადმინის ყველა ქმედება (მაღაზიის ნახვა, გადახდა, სტატუსის შეცვლა, პაროლის აღდგენა, ექსპორტი) იწერება აქ. ჩანაწერების წაშლა შეუძლებელია.</div>';
}

/* ================= settings ================= */
function settingsView(){const st=D.settings;
  return '<div class="hd"><h2>პარამეტრები</h2></div><section><h3>აბონენტის წესები</h3><div class="fg">'+
  '<label class="fl">საშეღავათო პერიოდი (დღე)<input id="st_g" type="number" min="0" value="'+st.grace+'"><small>გადახდის დღიდან რამდენ დღეში ჩაითვლება ვადაგადაცილებულად</small></label>'+
  '<label class="fl">შეზღუდვის შეთავაზება (დღე)<input id="st_r" type="number" min="1" value="'+st.restrictAfter+'"><small>ამდენი დღის დავალიანებისას სისტემა შეგახსენებთ შეზღუდვას. ავტომატურად არაფერი იბლოკება.</small></label>'+
  '<label class="fl">შეხსენება გადახდამდე (დღე)<input id="st_b" type="number" min="0" value="'+st.remindBefore+'"><small>მაღაზიას ელფოსტა მიუვა გადახდის დღემდე</small></label>'+
  '<label class="fl">სუპერ ადმინის ელფოსტა<input id="st_e" value="'+esc(st.email)+'"><small>აქ მოვა: ახალი რეგისტრაცია, დავალიანება, სისტემის შეცდომები</small></label>'+
  '<label class="fl">ინვოისის შენიშვნა<input id="st_v" value="'+esc(st.vatNote)+'"></label></div><div style="margin-top:12px"><button class="pri" onclick="saveSettings()">შენახვა</button></div></section>'+
  '<section><h3>უსაფრთხოება</h3><div class="row"><span>ორფაქტორიანი ავთენტიფიკაცია (2FA)<small>სუპერ ადმინისთვის სავალდებულოა, არ ითიშება</small></span><span class="tg g">ჩართულია</span></div>'+
  '<div class="row"><span>მაღაზიის მონაცემების ნახვა<small>მხოლოდ ნახვის რეჟიმი, ყოველი ნახვა ჟურნალში</small></span><span class="tg g">ჩართულია</span></div>'+
  '<div class="row"><span>მომხმარებლების პაროლები<small>ჰეშირებულია, სუპერ ადმინიც ვერ ხედავს</small></span><span class="tg g">დაცულია</span></div></section>'+
  '<section><h3>პროტოტიპი</h3><div class="row"><span>საჩვენებელი მონაცემების თავიდან დაყენება<small>ყველა ცვლილება წაიშლება ამ ბრაუზერში</small></span><button class="dng" onclick="resetDemo()">თავიდან დაყენება</button></div></section>';
}
function saveSettings(){const st=D.settings;st.grace=Math.max(0,+$('#st_g').value||0);st.restrictAfter=Math.max(1,+$('#st_r').value||30);st.remindBefore=Math.max(0,+$('#st_b').value||0);st.email=$('#st_e').value.trim();st.vatNote=$('#st_v').value.trim();log('პარამეტრები შეიცვალა');toast('შენახულია');render()}
function resetDemo(){if(window.SRP&&SRP.on){toast('რეალურ სისტემაში დემოს აღდგენა გამორთულია');return}resetDemoLocal()}
function resetDemoLocal(){modal('<h3>თავიდან დაყენება?</h3><p style="margin:0">ყველა თქვენი ცვლილება ამ პროტოტიპში წაიშლება.</p><div class="ft"><button onclick="closeM()">არა</button><button class="dngf" onclick="D=null;D=seed();save();closeM();go(\'overview\')">დიახ</button></div>')}

/* ================= boot ================= */
if(window.SRP&&SRP.on){SRP.boot()}else{D=load();render()}
</script>
