name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  database-and-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migrations + SQL tests
        run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres scripts/test-db.sh
      - name: App end-to-end (Node + headless Chrome)
        run: E2E_ADMIN_URL=postgresql://postgres:postgres@localhost:5432/postgres scripts/e2e/run.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: /tmp/sr-shots
          if-no-files-found: ignore
