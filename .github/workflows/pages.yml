name: deploy web to GitHub Pages
# Every push to main publishes web/ to https://<owner>.github.io/<repo>/ (Super Admin at .../superadmin/).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The pages learn where Supabase is from web/config.js, generated here. Both values are public by design
# (the anon key can do nothing without a login token). Override them with repository variables
# SUPABASE_URL / SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables).
# The database and the store-login function are deployed separately (npm run deploy).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write web/config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://yjavnjagfkecdafbxwxc.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqYXZuamFnZmtlY2RhZmJ4d3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNTk1MjQsImV4cCI6MjExMDgzNTUyNH0.zovS8fVZdWFPBizKWy7hv18JKnwynvcBmfkHLucb2LU' }}
          DEMO_HINT: ${{ vars.DEMO_HINT }}
        run: node scripts/write-config.mjs
      - name: Disable Jekyll
        run: touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
